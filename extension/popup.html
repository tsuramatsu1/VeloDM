<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font: 13px "Segoe UI", system-ui, sans-serif; width: 250px; margin: 0; padding: 14px; color: #1f2933; }
    h1 { font-size: 15px; margin: 0 0 10px; color: #1e6fd9; }
    label { display: flex; align-items: center; gap: 8px; margin: 8px 0; }
    input[type=number] { width: 80px; padding: 3px; }
    #status { margin-top: 12px; padding: 6px 8px; border-radius: 4px; background: #f3f5f8; }
    #status.ok { background: #e6f4ea; color: #1e6b36; }
    #status.bad { background: #fdecea; color: #a12622; }
  </style>
</head>
<body>
  <h1>VeloDM</h1>
  <label><input type="checkbox" id="enabled"> Capture downloads</label>
  <label><input type="checkbox" id="videoPill"> Show download button on videos</label>
  <label>Port <input type="number" id="port" min="1024" max="65535"></label>
  <div id="status">Checking…</div>
  <script src="popup.js"></script>
</body>
</html>
